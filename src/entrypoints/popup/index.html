<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Track the Tracker</title>
    <style>
      body { width: 320px; min-height: 200px; font-family: sans-serif; padding: 1rem; visibility: hidden; }
      h1 { font-size: 1rem; margin: 0; }
      .heading-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
      #reload-btn { background: #fff7ed; border: 1px solid #f97316; cursor: pointer; padding: 5px 12px; color: #c2410c; font-size: 0.8rem; font-family: inherit; font-weight: bold; border-radius: 4px; }
      #reload-btn:hover { background: #ffedd5; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid #d1d5db;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        vertical-align: middle;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="heading-row">
      <h1>Track the Tracker</h1>
      <button id="reload-btn" title="Reload">Reload</button>
    </div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
